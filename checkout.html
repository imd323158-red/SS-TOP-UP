<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - SS TOP UP</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f5f5f5;
font-family:Arial,sans-serif;
margin:0;
}

.header{
background:#0a9d3f;
color:white;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.box{
background:white;
width:90%;
margin:20px auto;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
}

input{
width:100%;
padding:14px;
margin:10px 0;
font-size:18px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

.payments{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

.pay{
background:white;
border:2px solid #0a9d3f;
border-radius:10px;
padding:20px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.pay:hover{
background:#0a9d3f;
color:white;
}

</style>

</head>

<body>

<div class="header">
💎 SS TOP UP
</div>

<div class="box">

<h2>Checkout</h2>

<input type="text" id="uid" placeholder="Enter Free Fire UID">

<input type="text" id="number" placeholder="Your bKash/Nagad Number">

<h2>Select Payment</h2>

<div class="payments">

<button class="pay" onclick="pay('bKash')">
bKash
</button>

<button class="pay" onclick="pay('Nagad')">
Nagad
</button>


</div>

</div>

<script>

function pay(method){

let uid=document.getElementById("uid").value;
let number=document.getElementById("number").value;

if(uid=="" || number==""){
alert("সব তথ্য পূরণ করুন");
return;k
}

localStorage.setItem("uid",uid);
localStorage.setItem("number",number);
localStorage.setItem("payment",method);
localStorage.setItem("price", localStorage.getItem("price"));
location.href="success.html";

}

</script>

</body>
</html>
