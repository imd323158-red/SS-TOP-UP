<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - SS TOP UP</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#0a9d3f;
color:#fff;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.box{
width:90%;
max-width:450px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
}

.info{
font-size:18px;
margin:10px 0;
}

.number{
background:#0a9d3f;
color:#fff;
padding:12px;
text-align:center;
font-size:22px;
font-weight:bold;
border-radius:8px;
margin:15px 0;
}

.amount{
background:#f0f0f0;
padding:12px;
text-align:center;
font-size:22px;
font-weight:bold;
border-radius:8px;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
font-size:18px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
font-size:20px;
background:#0a9d3f;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>

</head>
<body>

<div class="header">
💎 SS TOP UP
</div>

<div class="box">

<h2>Payment Confirmation</h2>

<div class="info">
<b>UID:</b>
<span id="uid"></span>
</div>

<div class="info">
<b>Payment:</b>
<span id="method"></span>
</div>

<div id="number" class="number"></div>

<div class="amount">
Amount: ৳<span id="amount"></span>
</div>

<input type="text" id="trx" placeholder="Enter Transaction ID">

<button onclick="confirmOrder()">
Confirm Payment
</button>

</div>

<script>

document.getElementById("uid").innerHTML=
localStorage.getItem("uid");

document.getElementById("method").innerHTML=
localStorage.getItem("payment");
document.getElementById("amount").innerHTML =
localStorage.getItem("price");
const payment = localStorage.getItem("payment");

document.getElementById("method").innerHTML = payment;

if(payment === "bKash"){
    document.getElementById("number").innerHTML =
    "<b>bKash:</b> 01827590725";
}
else if(payment === "Nagad"){
    document.getElementById("number").innerHTML =
    "<b>Nagad:</b> 01797716079";
}
function confirmOrder(){

let trx=document.getElementById("trx").value;

if(trx==""){
alert("Transaction ID দিন");
return;
}

alert(
"✅ Order Submitted Successfully!\n\n"+
"আমরা আপনার পেমেন্ট যাচাই করে অর্ডার সম্পন্ন করবো।"
);

localStorage.clear();

location.href="index.html";

}

</script>

</body>
</html>
